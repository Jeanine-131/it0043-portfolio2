<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Contact Information</title>
    <script src="js/theme-init.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>
            Contact Me!
        </h1>
        <p> Feel free to reach out to me!</p>
    </header>
    <nav>
        <button type="button" class="menu-toggle" aria-expanded="false">
        Menu
        </button>

    <div class="nav-links">
 
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="skills.html">Skills</a>
        <a href="contact.html">Contact</a>
    </div>
    </nav>
    <button type="button" class="theme-toggle">
        Dark Mode
    </button>
    <main>
        <section>
            <h2>Contact Form</h2>
            <form id="contact-form" novalidate>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required
                aria-describedby="name-error">
                <span class="field-error" id="name-error"></span>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required
                aria-describedby="email-error">
                <span class="field-error" id="email-error"></span>

                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" required
                aria-describedby="phone-error">
                 <span class="field-error" id="phone-error"></span>


                <label for="subject">Subject:</label>
                <input type="text" id="subject" name="subject" required
                aria-describedby="subject-error">
                <span class="field-error" id="subject-error"></span>

                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" required
                 aria-describedby="message-error"></textarea>
                <span class="field-error" id="message-error"></span>

                <button type="submit">Submit</button>

                <p id="form-success" role="status" hidden>
                   Your form is valid! Thank you for reaching out! 
                </p>
            </form>
            </section>
    </main>
    <footer>
        <p> My Portfolio &copy; 2026</p>
        <p> Created by Jeanine Elise S. Calara</p>
        <a href="contact.html">Contact Me</a>
        </footer>

        <script src="js/script.js"></script>
</body>
</html>
